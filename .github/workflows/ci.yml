name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies and generate API
        run: |
          uv sync --locked
          mkdir -p gen
          bash generate.sh

      - name: Run tests
        run: uv run --locked python -m unittest discover -s test
